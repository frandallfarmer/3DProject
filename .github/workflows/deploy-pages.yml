name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'README.md'
      - 'style.css'
      - 'viewer.html'
      - 'js/**'
      - 'built_stls/**'
      - 'media/**'
      - 'stl_files.json'
      - 'wall-templates/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if README.md changed
        id: readme-check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^README.md$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "README.md changed - will regenerate index.html"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "README.md unchanged - will use cached index.html"
          fi

      - name: Restore cached index.html
        if: steps.readme-check.outputs.changed == 'false'
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: index.html
          key: index-html-${{ hashFiles('README.md') }}
          restore-keys: |
            index-html-

      - name: Convert README to index.html
        if: steps.readme-check.outputs.changed == 'true' || steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
          pandoc README.md -f gfm -t html -s \
            --metadata title="D&D Terrain Pillar Connector" \
            --css=style.css \
            -o index.html
          echo "Generated fresh index.html from README.md"

      - name: Cache index.html
        if: steps.readme-check.outputs.changed == 'true' || steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: index.html
          key: index-html-${{ hashFiles('README.md') }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Verify index.html exists
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found before artifact upload!"
            echo "Falling back to Pandoc generation..."
            sudo apt-get update -qq
            sudo apt-get install -y pandoc
            pandoc README.md -f gfm -t html -s \
              --metadata title="D&D Terrain Pillar Connector" \
              --css=style.css \
              -o index.html
          fi
          echo "✓ index.html verified"
          ls -la index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 10
